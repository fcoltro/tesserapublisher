[workspace]
resolver = "2"
members = [
    "crates/tessera_geometry",
    "crates/tessera_color",
    "crates/tessera_io",
    "crates/tessera_text",
    "crates/tessera_document",
    "crates/tessera_layout",
    "crates/tessera_render",
    "crates/tessera_preflight",
    "crates/tessera_pdf",
    "crates/tessera_import",
    "crates/tessera_ui",
    "crates/tessera_bridge",
    "apps/tessera_app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches the LICENSE file actually shipping in this repository. The previous
# Cargo.toml declared MIT while shipping GPL-3.0 — fixed rather than carried
# forward.
license = "GPL-3.0-or-later"
authors = ["Hailmary"]
publish = false

# Single source of truth for versions. A crate writes `serde.workspace = true`.
#
# ## Upgrading: newest is not the goal
#
# **The right version of a dependency is the one that shares with whatever else
# already needs it, not the highest number.** Two semver-incompatible copies of
# a crate are two different types to the compiler, so a version nothing else
# agrees with costs compile time and binary size at best — and at worst cannot
# be used at all, which is what happens the moment a type crosses a boundary
# between crates.
#
# Both of those have already bitten here, and each is written up at the
# dependency it concerns rather than only in a commit message:
#
#   * `pollster` follows whatever eframe pins — 0.4 under eframe 0.35, 1.0
#     under 0.36. Asking for the other one adds a second copy beside it rather
#     than replacing it.
#   * `egui` was held at 0.35 for a month because 0.36 moves to wgpu 30 while
#     vello 0.10 is on wgpu 29, and this application hands egui's `Device` to
#     vello. That one does not compile at all; see the egui note for how it
#     was resolved.
#   * `resvg` is on 0.48 rather than something older *because* it shares kurbo
#     0.13 with this workspace; an earlier pick of 0.45 dragged a second kurbo
#     into every build and had to be undone.
#
# So: take patch and minor updates freely — `cargo update` is safe and was last
# run clean. Before taking a **major**, check what it does to
# `cargo tree --duplicates`, and be willing to conclude that staying put is the
# better answer. A held version without a written reason is the thing to avoid,
# not a held version.
[workspace.dependencies]
tessera_geometry = { path = "crates/tessera_geometry" }
tessera_color    = { path = "crates/tessera_color" }
tessera_io       = { path = "crates/tessera_io" }
tessera_text     = { path = "crates/tessera_text" }
tessera_document = { path = "crates/tessera_document" }
tessera_layout   = { path = "crates/tessera_layout" }
tessera_render   = { path = "crates/tessera_render" }
tessera_pdf      = { path = "crates/tessera_pdf" }
tessera_preflight = { path = "crates/tessera_preflight" }
tessera_import   = { path = "crates/tessera_import" }
tessera_ui       = { path = "crates/tessera_ui" }
tessera_bridge   = { path = "crates/tessera_bridge" }

# Interface. Was pinned to 0.35 to match oxiDRAFT, the reference
# implementation, and then held there by something harder than a preference:
# egui-wgpu 0.36 wants wgpu 30, vello 0.10 wants wgpu 29, and
# `view/vello_host.rs` hands egui's own `Device` straight to vello's
# `Renderer::new` — that shared device is decision D2 and the reason a panel
# and the page can be drawn in one frame. Two majors of wgpu cannot meet
# there. Tried on 2026-09-12: five type errors, every one of them `expected
# eframe::wgpu::Device, found vello::wgpu::Device`.
#
# Taken on 2026-09-20, because vello merged its wgpu 30 move (see the pin
# below). What the move cost: one `get_mapped_range` became fallible, one
# vertex buffer slot became `Option`, and two tests learned that modifiers are
# an event now and a texture can carry several deltas. What it bought: epaint
# 0.36 shares skrifa 0.44 with parley and vello, so skrifa, read-fonts,
# font-types and harfrust stop being in the tree twice.
egui      = "0.36"
# Default features, deliberately. Turning them off drops x11, wayland,
# default_fonts and winit/default -- which makes winit fail to compile on
# Linux entirely ("the platform you're compiling for is not supported").
# eframe's defaults do not include glow, so there was nothing to save.
eframe    = "0.36"
egui-wgpu = "0.36"

# Document surface. Must resolve to the same wgpu as egui-wgpu — the shared
# device in decision D2 depends on it — and it does: both are on wgpu 30.
#
# **A git pin, for now, and a written reason.** vello 0.10.0 is the newest
# release and is on wgpu 29; the move to 30 was merged upstream on
# 2026-09-15 (linebender/vello#1909) and has not been released. This is that
# merge commit, on the project's own `main` — not a fork, which the previous
# note refused and this one still would. **Replace with `vello = "0.11"` the
# day it is published**; `cargo info vello` says when. The crate has also
# moved to `research/vello_research` in that repository, with `vello_gpu`
# named as its intended successor: a signpost, not yet a task.
vello = { git = "https://github.com/linebender/vello", rev = "539ac99" }

# Geometry and text.
kurbo                = { version = "0.13", features = ["serde"] }
parley               = "0.11"
unicode-segmentation = "1.13"

# Document model and format.
slotmap    = { version = "1.1", features = ["serde"] }
serde      = { version = "1", features = ["derive"] }
# float_roundtrip is REQUIRED, not an optimisation. Without it serde_json
# parses floats to "best-effort precision" and a saved document comes back
# with geometry altered in the last bit — silently rewriting the user's work
# on every save. Found by the round-trip property test on its first run.
serde_json = { version = "1", features = ["float_roundtrip"] }
zip        = "8"
# The XML reader usvg already brings in, so IDML costs no second parser.
roxmltree  = "0.21"

# One HTTP request a day, for the version check, and nothing else in the
# workspace reaches the network. `platform-verifier` rather than a bundled root
# store: a machine behind a corporate proxy trusts that proxy through the
# operating system, and a client carrying its own roots fails there in a way
# nobody can fix from inside the application.
ureq       = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

# Assets and export.
flate2     = "1"
# TIFF is the one that matters for print: it is what a scanner writes and
# what a repro house sends. The rest cost a feature flag each, and every
# one of them decodes through the same `load_from_memory` call, so the
# screen and the PDF gain them together.
image      = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }

# SVG. Rasterised through resvg at whatever size the output asks for, rather
# than once at placement: a logo placed at 20mm and then enlarged to fill a
# cover must be re-rendered, not scaled up.
#
# 0.47 rather than 0.45, and the reason is kurbo. 0.45 reaches kurbo 0.11
# through svgtypes while this workspace and vello are on 0.13, so it drags a
# whole second copy of the geometry library into every build on every platform.
# 0.47 is on 0.13 and shares ours.
#
# The trade is tiny-skia: 0.47 wants 0.12 where `sctk-adwaita` — Wayland window
# decorations, by way of winit — wants 0.11. That duplicate exists only on
# Linux, and only for a crate that is not compiled on the other two platforms,
# which is a much smaller thing than a second kurbo everywhere.
#
# `text` is off. A placed SVG with live text needs the whole font stack a
# second time, resolved against a *different* font database than the one the
# document sets type with, and the two would disagree. Artwork bound for print
# carries outlines; an SVG with live text is one whose text will not appear,
# which preflight can say plainly.
resvg      = { version = "0.48", default-features = false }
usvg       = { version = "0.48", default-features = false }
tiny-skia  = "0.12"
pdf-writer = "0.15"
# `variable-fonts` is off. It exists to instance a variable font at chosen
# axis coordinates, and the PDF writer never asks for that — it calls
# `subset`, which passes no coordinates and refuses CFF2 either way, so the
# feature's code is unreachable from here. What it costs when on: a second
# skrifa, read-fonts and font-types beside the ones parley, vello and epaint
# share, plus write-fonts, all compiled for nothing.
subsetter  = { version = "0.2", default-features = false }
rfd        = "0.17"

# Colour management. Little CMS, vendored and built from source by `lcms2-sys`
# rather than linked against whatever the machine happens to have, so that a
# build is reproducible and does not need a system package on any of the three
# platforms. The `unsafe` lives inside those two crates; nothing in this
# workspace gains any.
lcms2 = "6"

# Blocking on async GPU calls in headless rendering.
# **Whatever eframe pins.** This was held at 0.4 while eframe 0.35 pinned 0.4,
# because asking for 1.0 then did not replace it — it added a second copy
# beside it. eframe 0.36 moved to 1.0, so the same rule now says 1.0: sharing
# a version with the framework that already needs one is worth more than any
# particular number, and this is the whole of what pollster does for us —
# two `block_on` calls when the headless renderer asks for a GPU adapter.
pollster = "1"

# Errors and testing.
thiserror = "2"
proptest  = "1"

# The geometry kernel and everything built on it are 100% safe Rust.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
