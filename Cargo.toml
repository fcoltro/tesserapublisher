[workspace]
members = [
    "src-tauri",
    "crates/core",
    "crates/renderer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hailmary"]
license = "MIT"

[workspace.dependencies]
bevy_ecs = "0.15"
im = { version = "15", features = ["serde"] }
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tessera-core = { path = "crates/core" }
tessera-renderer = { path = "crates/renderer" }
