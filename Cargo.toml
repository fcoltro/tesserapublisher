[workspace]
resolver = "2"
members = [
    "crates/tessera_geometry",
    "crates/tessera_color",
    "crates/tessera_io",
    "crates/tessera_text",
    "crates/tessera_document",
    "crates/tessera_layout",
    "crates/tessera_render",
    "crates/tessera_preflight",
    "crates/tessera_pdf",
    "crates/tessera_ui",
    "apps/tessera_app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches the LICENSE file actually shipping in this repository. The previous
# Cargo.toml declared MIT while shipping GPL-3.0 — fixed rather than carried
# forward.
license = "GPL-3.0-or-later"
authors = ["Hailmary"]
publish = false

# Single source of truth for versions. A crate writes `serde.workspace = true`.
[workspace.dependencies]
tessera_geometry = { path = "crates/tessera_geometry" }
tessera_color    = { path = "crates/tessera_color" }
tessera_io       = { path = "crates/tessera_io" }
tessera_text     = { path = "crates/tessera_text" }
tessera_document = { path = "crates/tessera_document" }
tessera_layout   = { path = "crates/tessera_layout" }
tessera_render   = { path = "crates/tessera_render" }
tessera_pdf      = { path = "crates/tessera_pdf" }
tessera_preflight = { path = "crates/tessera_preflight" }
tessera_ui       = { path = "crates/tessera_ui" }

# Interface. Pinned to 0.35 to match oxiDRAFT, the reference implementation.
egui      = "0.35"
# Default features, deliberately. Turning them off drops x11, wayland,
# default_fonts and winit/default -- which makes winit fail to compile on
# Linux entirely ("the platform you're compiling for is not supported").
# eframe's defaults do not include glow, so there was nothing to save.
eframe    = "0.35"
egui-wgpu = "0.35"

# Document surface. vello 0.10 and egui-wgpu 0.35 both resolve to wgpu 29.0.4 —
# verified, and the reason the shared-device design in decision D2 works.
vello = "0.10"

# Geometry and text.
kurbo                = { version = "0.13", features = ["serde"] }
parley               = "0.11"
unicode-segmentation = "1.13"

# Document model and format.
slotmap    = { version = "1.1", features = ["serde"] }
serde      = { version = "1", features = ["derive"] }
# float_roundtrip is REQUIRED, not an optimisation. Without it serde_json
# parses floats to "best-effort precision" and a saved document comes back
# with geometry altered in the last bit — silently rewriting the user's work
# on every save. Found by the round-trip property test on its first run.
serde_json = { version = "1", features = ["float_roundtrip"] }
zip        = "8"

# One HTTP request a day, for the version check, and nothing else in the
# workspace reaches the network. `platform-verifier` rather than a bundled root
# store: a machine behind a corporate proxy trusts that proxy through the
# operating system, and a client carrying its own roots fails there in a way
# nobody can fix from inside the application.
ureq       = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

# Assets and export.
flate2     = "1"
# TIFF is the one that matters for print: it is what a scanner writes and
# what a repro house sends. The rest cost a feature flag each, and every
# one of them decodes through the same `load_from_memory` call, so the
# screen and the PDF gain them together.
image      = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }

# SVG. Rasterised through resvg at whatever size the output asks for, rather
# than once at placement: a logo placed at 20mm and then enlarged to fill a
# cover must be re-rendered, not scaled up.
#
# 0.47 rather than 0.45, and the reason is kurbo. 0.45 reaches kurbo 0.11
# through svgtypes while this workspace and vello are on 0.13, so it drags a
# whole second copy of the geometry library into every build on every platform.
# 0.47 is on 0.13 and shares ours.
#
# The trade is tiny-skia: 0.47 wants 0.12 where `sctk-adwaita` — Wayland window
# decorations, by way of winit — wants 0.11. That duplicate exists only on
# Linux, and only for a crate that is not compiled on the other two platforms,
# which is a much smaller thing than a second kurbo everywhere.
#
# `text` is off. A placed SVG with live text needs the whole font stack a
# second time, resolved against a *different* font database than the one the
# document sets type with, and the two would disagree. Artwork bound for print
# carries outlines; an SVG with live text is one whose text will not appear,
# which preflight can say plainly.
resvg      = { version = "0.47", default-features = false }
usvg       = { version = "0.47", default-features = false }
tiny-skia  = "0.12"
pdf-writer = "0.15"
subsetter  = "0.2"
rfd        = "0.17"

# Colour management. Little CMS, vendored and built from source by `lcms2-sys`
# rather than linked against whatever the machine happens to have, so that a
# build is reproducible and does not need a system package on any of the three
# platforms. The `unsafe` lives inside those two crates; nothing in this
# workspace gains any.
lcms2 = "6"

# Blocking on async GPU calls in headless rendering.
pollster = "0.4"

# Errors and testing.
thiserror = "2"
proptest  = "1"

# The geometry kernel and everything built on it are 100% safe Rust.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
