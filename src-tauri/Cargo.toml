[package]
name = "tessera-publish"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tessera Publish Studio Backend Application"

[lib]
name = "tessera_publish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tessera-core = { workspace = true }
tessera-renderer = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bevy_ecs = { workspace = true }
# Used only to name the surface target type when handing the window to the renderer.
vello = { workspace = true }
