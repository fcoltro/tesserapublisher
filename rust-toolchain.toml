# Pin an exact version so local and CI agree. "stable" pinned nothing: CI took
# each new release's clippy lints the day they shipped and failed on code that
# passed here. Bump this, the two workflows' `dtolnay/rust-toolchain@` tags,
# and fix the new lints in one commit.
[toolchain]
channel = "1.99.0"
components = ["clippy", "rustfmt"]
