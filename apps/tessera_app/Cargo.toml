[package]
name = "tessera_app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tessera_ui.workspace = true
tessera_bridge.workspace = true
eframe.workspace = true
egui.workspace = true
serde_json.workspace = true
ureq.workspace = true

# `build.rs` renders the window icon from the PNG in `assets/` on every
# platform, and on Windows also embeds the application and document icons in
# the executable. `image` is needed only there: the application itself takes
# the window icon as pixels already scaled.
[build-dependencies]
ico = "0.5"
image.workspace = true
winresource = "0.1"
