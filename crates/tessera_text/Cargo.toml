[package]
name = "tessera_text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tessera_color.workspace = true
parley.workspace = true
serde.workspace = true
slotmap.workspace = true
unicode-segmentation.workspace = true
# Every language it has: 1.3 MB of patterns, which is what a layout tool for
# more than one country costs. A `language` on the text chooses among them.
hypher = { version = "0.1.7", default-features = false, features = ["alloc", "full"] }
skrifa = "0.44"

[dev-dependencies]
proptest.workspace = true
