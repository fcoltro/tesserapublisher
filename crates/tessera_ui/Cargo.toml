# The assistant's API key goes to the platform's own keychain — Windows'
# Credential Manager, macOS's Keychain — rather than the preferences file.
# Linux is not listed: its persistent store needs a D-Bus secret service,
# which is a runtime dependency a headless box may not have, so there the
# key stays in the file as before.
#
# `keyring_core` and the two stores, not the `keyring` 4 facade: its only
# `Entry` is behind a `v1` feature that names the zbus secret-service store
# unconditionally, so every Linux build would carry zbus and an async runtime
# for a store this module does not use. keyring's own documentation says an
# application should link the core and its stores directly.
keyring-core = "1"
# The Glyphs panel: each character's name and kind, to search and sort by.
unicode_names2.workspace = true
unicode-general-category.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
zip.workspace = true
serde_json.workspace = true
kurbo.workspace = true
# Integration tests link only against dev-dependencies.
tessera_geometry.workspace = true
tessera_color.workspace = true
tessera_document.workspace = true
tessera_layout.workspace = true
