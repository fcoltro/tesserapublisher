name: Release

# Installers are built from a tag, never from a branch. A build somebody can
# download has to correspond to a commit somebody can name — "the artefact from
# run 4471" is not a version anybody can report a bug against.
on:
  push:
    tags: ["v*"]
  # Buildable on demand as well, so the packaging can be exercised without
  # cutting a release to find out it is broken.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: msi
          - os: macos-latest
            kind: dmg
          - os: ubuntu-latest
            kind: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libfuse2 desktop-file-utils

      # **The profiles are part of the product, not part of the build.** They
      # are checked in, so a release carries exactly the profiles the tests ran
      # against rather than whatever a registry served that morning.
      - name: Check the profiles came with the checkout
        shell: bash
        run: |
          count=$(ls assets/profiles/*.icc 2>/dev/null | wc -l)
          echo "$count ICC profiles"
          if [ "$count" -eq 0 ]; then
            echo "No profiles: a release without them cannot soft-proof or"
            echo "export PDF/X. Run tools/vendor-profiles.py and commit them."
            exit 1
          fi

      - run: cargo build --release -p tessera_app

      - name: Package
        shell: bash
        run: bash packaging/build.sh "${{ matrix.kind }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.kind }}
          path: packaging/out/*
          if-no-files-found: error

  # Signing and notarization are **not** done here, and that is deliberate
  # rather than forgotten. Both need certificates that belong to a person or an
  # organisation, not to a repository, and a workflow that pretended to sign
  # would produce something users are told to trust and should not. See
  # docs/RELEASING.md for what is owed and who can do it.
